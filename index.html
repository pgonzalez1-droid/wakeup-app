.switch{width:48px;height:29px;flex:0 0 48px;border-radius:30px;background:#43586c;padding:3px;border:0;position:relative}.switch:before{content:"";display:block;width:23px;height:23px;border-radius:50%;background:white;transition:.2s}.switch.on{background:#159be9}.switch.on:before{transform:translateX(19px)}

.challenge-list{display:grid;grid-template-columns:1fr;gap:10px;margin-top:18px}.challenge-card{display:grid;grid-template-columns:54px minmax(0,1fr) 48px;align-items:center;gap:12px;width:100%;min-height:94px;padding:13px 14px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(115deg,#142f4b,#0d2239);box-shadow:0 7px 18px #0002}.challenge-card:active{transform:scale(.99)}.challenge-card .tileico{width:54px;height:54px;flex-basis:54px;margin:0}.challenge-info{min-width:0}.challenge-info strong{display:block;font-size:15px;line-height:1.25;margin-bottom:4px}.challenge-info small{display:block;color:var(--muted);font-size:12px;line-height:1.35;overflow-wrap:anywhere}.challenge-action{display:flex;align-items:center;justify-content:center}.challenge-card .switch{justify-self:end}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#142f4b,#0d2239);padding:14px;text-align:left;color:var(--txt);min-height:108px;min-width:0}.tile .tileico{margin-bottom:9px}.tile strong{display:block;font-size:14px}.tile small{color:var(--muted);font-size:11px}
.nav{position:fixed;z-index:5;bottom:0;left:0;right:0;padding:11px max(14px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom));background:#07192bea;backdrop-filter:blur(18px);border-top:1px solid #244663;display:flex;justify-content:space-around}.nav button{border:0;background:none;color:#8da9c0;font-size:11px;display:grid;gap:4px;justify-items:center}.nav button b{font-size:22px}.nav button.active{color:#68d5ff}
.back{background:none;border:0;color:#77d9ff;padding:5px 0 15px;font-size:16px}.field{display:grid;gap:7px;margin:14px 0;min-width:0}.field label{font-size:13px;color:#b9cfe1}.field input,.field select{width:100%;min-height:53px;border:1px solid #37617e;border-radius:16px;background:#091f34;color:white;padding:12px 14px;font-size:17px;min-width:0}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid #37617e;background:#0b2239;color:#c8dbea;border-radius:30px;padding:10px 13px;font-size:13px}.chip.selected{border-color:#50caff;background:#174d70;color:#fff;box-shadow:0 0 0 1px #50caff55}.option{display:flex;align-items:center;gap:11px;padding:12px;border:1px solid #2c5472;border-radius:15px;background:#0b2239;margin:8px 0}.option input{accent-color:#39baff;width:18px;height:18px}.range{width:100%;accent-color:#42bdff}.hint{font-size:12px;color:#9eb6cc;line-height:1.5}.danger{color:#ff9d9d}.soundrow{display:flex;align-items:center;gap:10px}.play{width:42px;height:42px;flex:0 0 42px;border-radius:50%;border:1px solid #4382a9;background:#17466b;color:#fff;font-size:17px}.toast{position:fixed;z-index:30;bottom:95px;left:50%;transform:translateX(-50%);background:#e7f7ff;color:#082037;padding:11px 16px;border-radius:20px;font-size:13px;font-weight:750;box-shadow:0 5px 20px #0006;display:none;max-width:90%;text-align:center}.stat{font-size:27px;font-weight:900}.logoBig{width:78px;height:78px;border-radius:22px}.game-choice{width:100%;padding:14px;border:1px solid #386a8c;border-radius:15px;background:#102f4b;color:white;text-align:left;margin:6px 0;font-weight:750}.game-choice:active{background:#1b5680}.game-input{width:100%;padding:15px;border:1px solid #386a8c;border-radius:15px;background:#081e33;color:white;font-size:20px;margin:10px 0}.game-progress{height:7px;border-radius:10px;background:#28445e;overflow:hidden;margin:12px 0}.game-progress span{display:block;height:100%;background:linear-gradient(90deg,#39adff,#70dcff)}.big-emoji{font-size:55px;text-align:center;margin:18px}.memory-pad{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.memory-pad button{height:88px;border:0;border-radius:18px;font-size:32px}.draw-board{width:100%;height:280px;display:block;background:#f7fbff;border:2px solid #58bfff;border-radius:16px;touch-action:none}.draw-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}.draw-tools button{border:1px solid #37617e;background:#0b2239;color:white;border-radius:12px;padding:9px 12px}.draw-tools input{width:44px;height:38px;padding:2px}
@media(max-width:380px){main{padding-left:13px;padding-right:13px}.two{grid-template-columns:1fr}.time{font-size:51px}.challenge-card{grid-template-columns:50px minmax(0,1fr) 46px;padding:12px;gap:9px}.challenge-card .tileico{width:50px;height:50px;flex-basis:50px}.grid{gap:8px}}

</style></head><body><main id="app"></main>
<nav class="nav"><button data-tab="home"><b>⌂</b>Inicio</button><button data-tab="alarms"><b>◷</b>Alarmas</button><button data-tab="challenges"><b>⚡</b>Retos</button><button data-tab="sounds"><b>♫</b>Sonidos</button><button data-tab="settings"><b>⚙</b>Ajustes</button></nav><div id="toast" class="toast"></div>
<script>
const $=s=>document.querySelector(s),storeKey='wakeup_v3_data';
const defs=[
{id:'math',name:'Matemáticas',ico:'🧮',desc:'Cálculos y operaciones',opts:['Sumas','Restas','Multiplicaciones','Divisiones','Operaciones mixtas'],diff:['Fácil','Medio','Difícil']},
{id:'quiz',name:'Cultura general',ico:'🎓',desc:'Historia, ciencia y geografía',opts:['Historia','Biología','Geografía','Ciencia','Deportes','Tecnología'],diff:['Fácil','Medio','Difícil']},
{id:'exercise',name:'Ejercicio',ico:'💪',desc:'Activa el cuerpo',opts:['Flexiones','Sentadillas','Abdominales','Saltos','Plancha'],diff:['Suave','Medio','Intenso']},
{id:'objects',name:'Buscar objetos',ico:'🧸',desc:'Encuentra algo de tu habitación',opts:['Elegir objeto aleatorio','Elegir objeto manual'],diff:['Fácil','Medio','Difícil']},
{id:'draw',name:'Dibujo',ico:'🎨',desc:'Dibuja lo que aparece',opts:['Objetos','Animales','Formas','Dibujo libre'],diff:['Fácil','Medio','Difícil']},
{id:'memory',name:'Memoria',ico:'🧠',desc:'Recuerda colores, números y secuencias',opts:['Colores','Números','Secuencias','Parejas'],diff:['Fácil','Medio','Difícil']},
{id:'observe',name:'Observación',ico:'👀',desc:'Encuentra detalles y diferencias',opts:['Encuentra diferencias','Detecta el intruso','Recuerda la imagen'],diff:['Fácil','Medio','Difícil']},
{id:'logic',name:'Lógica',ico:'🧩',desc:'Patrones y rompecabezas',opts:['Series','Patrones','Acertijos','Puzles'],diff:['Fácil','Medio','Difícil']},
{id:'sounds',name:'Reconocer sonidos',ico:'🔊',desc:'Identifica sonidos',opts:['Animales','Objetos','Instrumentos','Sonidos cotidianos'],diff:['Fácil','Medio','Difícil']},
{id:'speed',name:'Rapidez mental',ico:'⚡',desc:'Responde contra el reloj',opts:['Cálculo rápido','Palabras','Reacción','Preguntas rápidas'],diff:['Fácil','Medio','Difícil']}
];
const defaults={alarms:[],selected:['math'],objects:['🧸 Peluche','🔑 Llaves','📚 Libro','🎧 Auriculares'],configs:{},sound:'Militar',volume:75,streak:0,strict:false,completed:0};
let data;try{let old=JSON.parse(localStorage.getItem(storeKey)||'null')||JSON.parse(localStorage.getItem('wakeup_v2_data')||'{}');data={...defaults,...old,configs:old.configs||{}}}catch{data={...defaults}}
let page='home',editing=null,activeChallenge=null,ctxAudio=null,ringInterval=null,ringAlarm=null,gameQueue=[],gameIndex=0,gameCurrent=null;
function save(){localStorage.setItem(storeKey,JSON.stringify(data))}
function toast(t){let e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.style.display='none',2400)}
function go(p){page=p;render();window.scrollTo(0,0)}
function cfg(id){if(!data.configs[id])data.configs[id]={options:[defs.find(x=>x.id===id).opts[0]],difficulty:'Fácil'};return data.configs[id]}
function header(){return '<header><div class="brand"><svg class="brand-mark" viewBox="0 0 64 64" role="img" aria-label="Logo WakeUp"><defs><linearGradient id="wuGlow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffc078"/><stop offset="1" stop-color="#ef7628"/></linearGradient></defs><rect x="3" y="3" width="58" height="58" rx="19" fill="#261811" stroke="#99552d" stroke-width="2"/><path d="M18 18 12 10M46 18l6-8" stroke="#ffb36e" stroke-width="5" stroke-linecap="round"/><path d="M17 28a15 15 0 0 1 30 0v13a15 15 0 0 1-30 0z" fill="url(#wuGlow)" stroke="#ffe0bd" stroke-width="2"/><path d="M23 36q4-5 8 0m3 0q4-5 8 0" fill="none" stroke="#442312" stroke-width="2.8" stroke-linecap="round"/><path d="M30 18q-7-7 1-11 0 7 7 5 5-1 6 5-7-3-14 1z" fill="#fff0dc" stroke="#a95426" stroke-width="1.5"/><path d="M44 10q5-5 8 0m-3 5q5-4 8 1" fill="none" stroke="#ffc078" stroke-width="2" stroke-linecap="round"/></svg><div>Wake<span>Up</span></div></div><button class="round" data-action="welcome">☀️</button></header>'}
function challengeCard(d){let c=cfg(d.id),on=data.selected.includes(d.id);return '<div class="challenge-card"><div class="tileico">'+d.ico+'</div><div class="challenge-info" data-open-challenge="'+d.id+'"><strong>'+d.name+'</strong><small>'+d.desc+'</small><small style="margin-top:5px">'+c.difficulty+' · '+c.options.length+' modalidad(es)</small></div><div class="challenge-action"><button class="switch '+(on?'on':'')+'" data-select-challenge="'+d.id+'" aria-label="'+(on?'Desactivar':'Activar')+' '+d.name+'"></button></div></div>'}
function home(){let next=data.alarms.filter(a=>a.enabled).sort((a,b)=>a.time.localeCompare(b.time))[0];return header()+'<h1>¡Buenos días! 👋</h1><div class="sub">Empieza el día con energía. Primero, despierta.</div><section class="hero"><div class="eyebrow">☀️ TU PRÓXIMA ALARMA</div><div class="time">'+(next?next.time:'07:30')+'</div><div class="sub">'+(next?(next.repeat==='Nunca'?'Una sola vez':next.repeat)+' · '+next.challenges.length+' retos':'Aún no has creado ninguna alarma')+'</div><div class="flex" style="margin-top:18px"><span class="chip">⚡ Despierta tu mente</span><button class="btn" data-action="newAlarm">＋ Nueva alarma</button></div></section><div class="section"><h2>Mis alarmas</h2><span class="muted">'+data.alarms.length+' alarmas</span></div>'+(data.alarms.map(alarmCard).join('')||'<div class="card empty">Todavía no tienes alarmas. Crea la primera con «Nueva alarma».</div>')+'<div class="section"><h2>Mis retos ⚡</h2><span class="muted">'+data.selected.length+' activos</span></div><div class="challenge-list">'+(defs.filter(d=>data.selected.includes(d.id)).map(challengeCard).join('')||'<div class="card empty">Todavía no has seleccionado retos.</div>')+'</div><div class="section"><h2>Accesos rápidos</h2></div><div class="grid"><button class="tile" data-action="objects"><div class="tileico">🧸</div><strong>Mis objetos</strong><small>'+data.objects.length+' objetos guardados</small></button><button class="tile" data-tab="stats"><div class="tileico">🔥</div><strong>Estadísticas</strong><small>Tu progreso</small></button></div>'}
function alarmCard(a){return '<div class="card alarmrow"><div class="alarmico">⏰</div><div class="grow"><div class="alarmtime">'+a.time+'</div><div class="meta">'+a.repeat+' · '+a.challenges.length+' retos · '+a.sound+'</div></div><button class="switch '+(a.enabled?'on':'')+'" data-toggle-alarm="'+a.id+'"></button><button class="btn ghost" data-edit="'+a.id+'">✎</button></div>'}
function alarms(){return header()+'<button class="back" data-tab="home">← Volver</button><h1>Mis alarmas ⏰</h1><p class="sub">Crea y organiza tus despertadores.</p><button class="btn full" data-action="newAlarm">＋ Nueva alarma</button><div style="margin-top:18px">'+(data.alarms.map(alarmCard).join('')||'<div class="card empty">No hay alarmas creadas todavía.</div>')+'</div><p class="hint">Importante: en iPhone, esta versión web solo puede reproducir la alarma mientras la página permanece abierta y activa. No puede garantizar que suene con Safari cerrado o el móvil bloqueado.</p>'}
function alarmForm(){let a=editing?data.alarms.find(x=>x.id===editing):null,selected=a?a.challenges:data.selected;return header()+'<button class="back" data-tab="alarms">← Volver</button><h1>'+(a?'Editar alarma':'Nueva alarma')+' ⏰</h1><p class="sub">Configura cuándo y cómo quieres despertarte.</p><div class="card"><div class="two"><div class="field"><label>Hora</label><input id="alarmTime" type="time" value="'+(a?.time||'07:30')+'"></div><div class="field"><label>Repetir</label><select id="repeat"><option '+(a?.repeat==='Nunca'?'selected':'')+'>Nunca</option><option '+(a?.repeat==='Cada día'?'selected':'')+'>Cada día</option><option '+(a?.repeat==='Días laborables'?'selected':'')+'>Días laborables</option><option '+(a?.repeat==='Fines de semana'?'selected':'')+'>Fines de semana</option></select></div></div><div class="field"><label>Retos incluidos</label><div class="chips">'+defs.map(d=>'<button class="chip '+(selected.includes(d.id)?'selected':'')+'" data-pick-challenge="'+d.id+'">'+d.ico+' '+d.name+'</button>').join('')+'</div><p class="hint">Selecciona los retos que tendrás que completar para apagar esta alarma.</p></div><div class="field"><label>Sonido de alarma</label><div class="soundrow"><select id="alarmSound">'+['Pájaros y lluvia','Militar','Tranquila','Pajaritos','Rock','Electrónica','Clásica','Pi, pi, pi'].map(s=>'<option '+(((a?.sound)||data.sound)===s?'selected':'')+'>'+s+'</option>').join('')+'</select><button class="play" data-action="previewSelected">▶</button></div></div><div class="field"><label>Volumen · <span id="volLabel">'+(a?.volume??data.volume)+'%</span></label><input class="range" id="alarmVolume" type="range" min="10" max="100" value="'+(a?.volume??data.volume)+'"></div><button class="btn full" data-action="saveAlarm">Guardar alarma</button>'+(a?'<button class="btn ghost full" data-action="deleteAlarm">Eliminar alarma</button>':'')+'</div>'}

function playTone(name='Militar',vol=75){try{if(name==='Pájaros y lluvia'){stopSound();ambientAudio=new Audio('https://commons.wikimedia.org/wiki/Special:Redirect/file/Rainthunderandbirds.ogg');ambientAudio.loop=true;ambientAudio.volume=Math.min(1,Math.max(.1,vol/100));ambientAudio.play().catch(()=>toast('No se ha podido cargar el sonido de pájaros y lluvia'));return}let AC=window.AudioContext||window.webkitAudioContext;if(!AC){toast('Este navegador no permite reproducir audio');return}stopSound();ctxAudio=ctxAudio||new AC();if(ctxAudio.state==='suspended')ctxAudio.resume();const start=ctxAudio.currentTime+0.04,level=Math.max(.01,Math.min(1,vol/100))*.42;

if(name==='Militar'){let notes=[392,523,659,784,659,784,988,784,659,523,392];notes.forEach((f,i)=>add(f,start+i*.29,.34,'sawtooth',f*.99,i%3===0?1:.8));[0,.58,1.16,1.74,2.32].forEach(t=>{add(95,start+t,.16,'triangle',55,.85);add(62,start+t+.04,.12,'sine',42,.7)})}

else{[880,660,880,660].forEach((f,i)=>add(f,start+i*.35,.2,'square',null,1))}
}catch(e){toast('No se ha podido reproducir el sonido')}}

if(d.id==='math'||d.id==='speed'){let a=rand(3,level===3?30:12),b=rand(2,level===3?15:9),op=(opts[0]||'Sumas');if(op==='Restas')return answerGame('¿Cuánto es '+(a+b)+' − '+b+'?',String(a),true);if(op==='Multiplicaciones')return answerGame('¿Cuánto es '+a+' × '+b+'?',String(a*b),true);if(op==='Divisiones')return answerGame('¿Cuánto es '+(a*b)+' ÷ '+b+'?',String(a),true);return answerGame('¿Cuánto es '+a+' + '+b+'?',String(a+b),true)}

rn}gameIndex++;showNextGame()};return}if(g.type==='input')$('#checkGame').onclick=()=>checkGame($('#gameAnswer').value.trim(),g.correct);if(g.type==='choice')document.querySelectorAll('[data-game-choice]').forEach(b=>b.onclick=()=>checkGame(decodeURIComponent(b.dataset.gameChoice),g.correct));if(g.type==='memory')$('#remember').onclick=()=>{let box=$('#memoryChoices');$('#sequence').textContent='¿Cuál era la secuencia?';box.innerHTML='<input class="game-input" id="memoryAnswer" placeholder="rojo, verde, rojo..."><button class="btn full" id="checkMemory">Comprobar</button>';$('#checkMemory').onclick=()=>{let answer=$('#memoryAnswer').value.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').split(/[ ,;]+/).filter(Boolean).join('|');let expected=g.seq.map(x=>x.normalize('NFD').replace(/[\\u0300-\\u036f]/g,'')).join('|');checkGame(answer,expected)}}}
function checkGame(value,correct){let ok=String(value).trim().toLowerCase()===String(correct).trim().toLowerCase();if(ok){gameIndex++;showNextGame()}else{$('#gameFeedback').textContent='No es correcto. ¡Inténtalo otra vez!';$('#gameFeedback').style.color='#ffb3a7'}}
function checkAlarms(){let now=new Date(),hh=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'),stamp=now.toDateString()+' '+hh;data.alarms.forEach(a=>{if(a.enabled&&a.time===hh&&a.lastFired!==stamp){a.lastFired=stamp;save();startRinging(a)}})}
setInterval(checkAlarms,10000);
function openChallenge(id){activeChallenge=id;go('challengeDetail')}
function saveAlarm(){let time=$('#alarmTime').value,repeat=$('#repeat').value,sound=$('#alarmSound').value,volume=Number($('#alarmVolume').value);if(!time){toast('Selecciona una hora');return}let chosen=[...document.querySelectorAll('[data-pick-challenge].selected')].map(x=>x.dataset.pickChallenge);if(!chosen.length){toast('Selecciona al menos un reto');return}let alarm={id:editing||String(Date.now()),time,repeat,challenges:chosen,sound,volume,enabled:true};if(editing){let i=data.alarms.findIndex(x=>x.id===editing);data.alarms[i]=alarm}else data.alarms.push(alarm);data.sound=sound;data.volume=volume;data.selected=[...new Set([...data.selected,...chosen])];save();editing=null;toast('Alarma guardada');go('alarms')}
document.addEventListener('click',e=>{let t=e.target.closest('button,[data-open-challenge]');if(!t)return;if(t.dataset.tab){go(t.dataset.tab);return}if(t.dataset.openChallenge){openChallenge(t.dataset.openChallenge);return}if(t.dataset.challenge){openChallenge(t.dataset.challenge);return}if(t.dataset.pickChallenge){t.classList.toggle('selected');return}if(t.dataset.difficulty){cfg(activeChallenge).difficulty=t.dataset.difficulty;save();render();return}if(t.dataset.action){let a=t.dataset.action;if(a==='newAlarm'){editing=null;go('alarmform')}else if(a==='saveAlarm')saveAlarm();else if(a==='previewSelected')playTone($('#alarmSound').value,Number($('#alarmVolume').value));else if(a==='objects')go('objects');else if(a==='addObject'){let v=$('#newObject').value.trim();if(v){data.objects.push(v);save();render();toast('Objeto añadido')}}else if(a==='strict'){data.strict=!data.strict;save();render()}else if(a==='saveChallenge'){if(!cfg(activeChallenge).options.length){toast('Selecciona al menos una modalidad');return}save();toast('Reto actualizado');go('challenges')}else if(a==='deleteAlarm'){data.alarms=data.alarms.filter(x=>x.id!==editing);save();editing=null;go('alarms')}else if(a==='welcome')toast('¡Que tengas un buen día!');return}if(t.dataset.selectChallenge){let id=t.dataset.selectChallenge;data.selected=data.selected.includes(id)?data.selected.filter(x=>x!==id):[...data.selected,id];save();render();return}if(t.dataset.toggleAlarm){let a=data.alarms.find(x=>x.id===t.dataset.toggleAlarm);a.enabled=!a.enabled;save();render();return}if(t.dataset.edit){editing=t.dataset.edit;go('alarmform');return}if(t.dataset.preview){togglePreview(t.dataset.preview);return}if(t.dataset.chooseSound){data.sound=t.dataset.chooseSound;save();render();toast('Sonido seleccionado');return}if(t.dataset.removeObject!==undefined){data.objects.splice(Number(t.dataset.removeObject),1);save();render();return}});
document.addEventListener('change',e=>{if(e.target.dataset.option){let value=decodeURIComponent(e.target.dataset.option),c=cfg(activeChallenge);c.options=e.target.checked?[...new Set([...c.options,value])]:c.options.filter(x=>x!==value);save()}if(e.target.id==='alarmVolume')$('#volLabel').textContent=e.target.value+'%';if(e.target.id==='defaultVolume'){data.volume=Number(e.target.value);$('#defaultVolLabel').textContent=e.target.value;save()}});
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();
