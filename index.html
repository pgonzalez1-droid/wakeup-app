<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07172a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="WakeUp">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png">
<title>WakeUp · WAKE UP. NO EXCUSES.</title>
<style>
:root{color-scheme:dark;--bg:#061629;--panel:#102b47;--panel2:#153956;--line:#285273;--blue:#39adff;--cyan:#70dcff;--txt:#f5f9ff;--muted:#9eb6cc;--green:#3de0b0;--shadow:0 14px 34px #0004}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:radial-gradient(ellipse at 50% -12%,#14517a 0,transparent 48%),linear-gradient(180deg,#07192e,#061426 70%);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
main{width:min(100%,560px);margin:auto;padding:env(safe-area-inset-top) 17px 118px}
header{display:flex;justify-content:space-between;align-items:center;padding:15px 2px 22px}.brand{display:flex;align-items:center;gap:9px;font-size:25px;font-weight:950;letter-spacing:-1px}.brand img{width:43px;height:43px;border-radius:13px}.brand span{color:var(--cyan)}.round{width:43px;height:43px;border-radius:50%;border:1px solid #477ba0;background:linear-gradient(145deg,#258bdb,#164b8c);font-size:20px;color:white}
h1{font-size:29px;letter-spacing:-1px;margin:8px 0 5px}h2{font-size:19px;margin:0}.sub{color:var(--muted);font-size:14px;line-height:1.5;margin:7px 0 16px}.hero{margin-top:19px;padding:20px;border:1px solid #3476a0;border-radius:26px;background:linear-gradient(145deg,#174d75,#102943 70%);box-shadow:var(--shadow)}.eyebrow{font-size:11px;letter-spacing:1.3px;color:#c8edff;font-weight:850}.time{font-size:58px;font-weight:900;letter-spacing:-3px;margin:7px 0}.flex{display:flex;align-items:center;justify-content:space-between;gap:10px}.btn{border:0;border-radius:16px;padding:14px 17px;font-weight:850;background:linear-gradient(100deg,#35aaff,#70ddff);color:#04182a}.btn.secondary{background:#173b5b;color:#e3f5ff;border:1px solid #386a8c}.btn.ghost{background:#0b2137;color:#bfeaff;border:1px solid #315a79}.btn.full{width:100%;margin-top:12px}.section{display:flex;justify-content:space-between;align-items:center;margin:25px 2px 12px}.muted{font-size:12px;color:var(--muted)}.card{padding:15px;border:1px solid var(--line);border-radius:19px;background:linear-gradient(145deg,#122f4c,#0d233b);margin-bottom:11px;min-width:0}.empty{text-align:center;color:var(--muted);padding:22px 15px}.alarmrow{display:flex;align-items:center;gap:11px}.alarmico,.tileico{width:48px;height:48px;flex:0 0 48px;border-radius:15px;background:#1c4b70;display:grid;place-items:center;font-size:23px}.grow{flex:1;min-width:0}.alarmtime{font-size:24px;font-weight:900}.meta{font-size:12px;color:var(--muted);margin-top:3px}
.switch{width:48px;height:29px;flex:0 0 48px;border-radius:30px;background:#43586c;padding:3px;border:0;position:relative}.switch:before{content:"";display:block;width:23px;height:23px;border-radius:50%;background:white;transition:.2s}.switch.on{background:#159be9}.switch.on:before{transform:translateX(19px)}
/* Totes les targetes de reptes comparteixen exactament la mateixa estructura i mida. */
.challenge-list{display:grid;grid-template-columns:1fr;gap:10px;margin-top:18px}.challenge-card{display:grid;grid-template-columns:54px minmax(0,1fr) 48px;align-items:center;gap:12px;width:100%;min-height:94px;padding:13px 14px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(115deg,#142f4b,#0d2239);box-shadow:0 7px 18px #0002}.challenge-card:active{transform:scale(.99)}.challenge-card .tileico{width:54px;height:54px;flex-basis:54px;margin:0}.challenge-info{min-width:0}.challenge-info strong{display:block;font-size:15px;line-height:1.25;margin-bottom:4px}.challenge-info small{display:block;color:var(--muted);font-size:12px;line-height:1.35;overflow-wrap:anywhere}.challenge-action{display:flex;align-items:center;justify-content:center}.challenge-card .switch{justify-self:end}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#142f4b,#0d2239);padding:14px;text-align:left;color:var(--txt);min-height:108px;min-width:0}.tile .tileico{margin-bottom:9px}.tile strong{display:block;font-size:14px}.tile small{color:var(--muted);font-size:11px}
.nav{position:fixed;z-index:5;bottom:0;left:0;right:0;padding:11px max(14px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom));background:#07192bea;backdrop-filter:blur(18px);border-top:1px solid #244663;display:flex;justify-content:space-around}.nav button{border:0;background:none;color:#8da9c0;font-size:11px;display:grid;gap:4px;justify-items:center}.nav button b{font-size:22px}.nav button.active{color:#68d5ff}
.back{background:none;border:0;color:#77d9ff;padding:5px 0 15px;font-size:16px}.field{display:grid;gap:7px;margin:14px 0;min-width:0}.field label{font-size:13px;color:#b9cfe1}.field input,.field select{width:100%;min-height:53px;border:1px solid #37617e;border-radius:16px;background:#091f34;color:white;padding:12px 14px;font-size:17px;min-width:0}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid #37617e;background:#0b2239;color:#c8dbea;border-radius:30px;padding:10px 13px;font-size:13px}.chip.selected{border-color:#50caff;background:#174d70;color:#fff;box-shadow:0 0 0 1px #50caff55}.option{display:flex;align-items:center;gap:11px;padding:12px;border:1px solid #2c5472;border-radius:15px;background:#0b2239;margin:8px 0}.option input{accent-color:#39baff;width:18px;height:18px}.range{width:100%;accent-color:#42bdff}.hint{font-size:12px;color:#9eb6cc;line-height:1.5}.danger{color:#ff9d9d}.soundrow{display:flex;align-items:center;gap:10px}.play{width:42px;height:42px;flex:0 0 42px;border-radius:50%;border:1px solid #4382a9;background:#17466b;color:#fff;font-size:17px}.toast{position:fixed;z-index:30;bottom:95px;left:50%;transform:translateX(-50%);background:#e7f7ff;color:#082037;padding:11px 16px;border-radius:20px;font-size:13px;font-weight:750;box-shadow:0 5px 20px #0006;display:none;max-width:90%;text-align:center}.stat{font-size:27px;font-weight:900}.logoBig{width:78px;height:78px;border-radius:22px}.game-choice{width:100%;padding:14px;border:1px solid #386a8c;border-radius:15px;background:#102f4b;color:white;text-align:left;margin:6px 0;font-weight:750}.game-choice:active{background:#1b5680}.game-input{width:100%;padding:15px;border:1px solid #386a8c;border-radius:15px;background:#081e33;color:white;font-size:20px;margin:10px 0}.game-progress{height:7px;border-radius:10px;background:#28445e;overflow:hidden;margin:12px 0}.game-progress span{display:block;height:100%;background:linear-gradient(90deg,#39adff,#70dcff)}.big-emoji{font-size:55px;text-align:center;margin:18px}.memory-pad{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.memory-pad button{height:88px;border:0;border-radius:18px;font-size:32px}.draw-board{width:100%;height:280px;display:block;background:#f7fbff;border:2px solid #58bfff;border-radius:16px;touch-action:none}.draw-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}.draw-tools button{border:1px solid #37617e;background:#0b2239;color:white;border-radius:12px;padding:9px 12px}.draw-tools input{width:44px;height:38px;padding:2px}
@media(max-width:380px){main{padding-left:13px;padding-right:13px}.two{grid-template-columns:1fr}.time{font-size:51px}.challenge-card{grid-template-columns:50px minmax(0,1fr) 46px;padding:12px;gap:9px}.challenge-card .tileico{width:50px;height:50px;flex-basis:50px}.grid{gap:8px}}
</style></head><body><main id="app"></main>
<nav class="nav"><button data-tab="home"><b>⌂</b>Inicio</button><button data-tab="alarms"><b>◷</b>Alarmas</button><button data-tab="challenges"><b>⚡</b>Retos</button><button data-tab="sounds"><b>♫</b>Sonidos</button><button data-tab="settings"><b>⚙</b>Ajustes</button></nav><div id="toast" class="toast"></div>
<script>
const $=s=>document.querySelector(s),storeKey='wakeup_v3_data';
const defs=[
{id:'math',name:'Matemáticas',ico:'🧮',desc:'Cálculos y operaciones',opts:['Sumas','Restas','Multiplicaciones','Divisiones','Operaciones mixtas'],diff:['Fácil','Medio','Difícil']},
{id:'quiz',name:'Cultura general',ico:'🎓',desc:'Historia, ciencia y geografía',opts:['Historia','Biología','Geografía','Ciencia','Deportes','Tecnología'],diff:['Fácil','Medio','Difícil']},
{id:'exercise',name:'Ejercicio',ico:'💪',desc:'Activa el cuerpo',opts:['Flexiones','Sentadillas','Abdominales','Saltos','Plancha'],diff:['Suave','Medio','Intenso']},
{id:'objects',name:'Buscar objetos',ico:'🧸',desc:'Encuentra algo de tu habitación',opts:['Elegir objeto aleatorio','Elegir objeto manual'],diff:['Fácil','Medio','Difícil']},
{id:'draw',name:'Dibujo',ico:'🎨',desc:'Dibuja lo que aparece',opts:['Objetos','Animales','Formas','Dibujo libre'],diff:['Fácil','Medio','Difícil']},
{id:'memory',name:'Memoria',ico:'🧠',desc:'Recuerda colores, números y secuencias',opts:['Colores','Números','Secuencias','Parejas'],diff:['Fácil','Medio','Difícil']},
{id:'observe',name:'Observación',ico:'👀',desc:'Encuentra detalles y diferencias',opts:['Encuentra diferencias','Detecta el intruso','Recuerda la imagen'],diff:['Fácil','Medio','Difícil']},
{id:'logic',name:'Lógica',ico:'🧩',desc:'Patrones y rompecabezas',opts:['Series','Patrones','Acertijos','Puzles'],diff:['Fácil','Medio','Difícil']},
{id:'sounds',name:'Reconocer sonidos',ico:'🔊',desc:'Identifica sonidos',opts:['Animales','Objetos','Instrumentos','Sonidos cotidianos'],diff:['Fácil','Medio','Difícil']},
{id:'speed',name:'Rapidez mental',ico:'⚡',desc:'Responde contra el reloj',opts:['Cálculo rápido','Palabras','Reacción','Preguntas rápidas'],diff:['Fácil','Medio','Difícil']}
];
const defaults={alarms:[],selected:['math'],objects:['🧸 Peluche','🔑 Llaves','📚 Libro','🎧 Auriculares'],configs:{},sound:'Militar',volume:75,streak:0,strict:false,completed:0};
let data;try{let old=JSON.parse(localStorage.getItem(storeKey)||'null')||JSON.parse(localStorage.getItem('wakeup_v2_data')||'{}');data={...defaults,...old,configs:old.configs||{}}}catch{data={...defaults}}
let page='home',editing=null,activeChallenge=null,ctxAudio=null,ringInterval=null,ringAlarm=null,gameQueue=[],gameIndex=0,gameCurrent=null;
function save(){localStorage.setItem(storeKey,JSON.stringify(data))}
function toast(t){let e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.style.display='none',2400)}
function go(p){page=p;render();window.scrollTo(0,0)}
function cfg(id){if(!data.configs[id])data.configs[id]={options:[defs.find(x=>x.id===id).opts[0]],difficulty:'Fácil'};return data.configs[id]}
function header(){return '<header><div class="brand"><img src="icon.png" alt="Logo WakeUp"><div>Wake<span>Up</span></div></div><button class="round" data-action="welcome">☀️</button></header>'}
function challengeCard(d){let c=cfg(d.id),on=data.selected.includes(d.id);return '<div class="challenge-card"><div class="tileico">'+d.ico+'</div><div class="challenge-info" data-open-challenge="'+d.id+'"><strong>'+d.name+'</strong><small>'+d.desc+'</small><small style="margin-top:5px">'+c.difficulty+' · '+c.options.length+' modalidad(es)</small></div><div class="challenge-action"><button class="switch '+(on?'on':'')+'" data-select-challenge="'+d.id+'" aria-label="'+(on?'Desactivar':'Activar')+' '+d.name+'"></button></div></div>'}
function home(){let next=data.alarms.filter(a=>a.enabled).sort((a,b)=>a.time.localeCompare(b.time))[0];return header()+'<h1>¡Buenos días! 👋</h1><div class="sub">Empieza el día con energía. Primero, despierta.</div><section class="hero"><div class="eyebrow">☀️ TU PRÓXIMA ALARMA</div><div class="time">'+(next?next.time:'07:30')+'</div><div class="sub">'+(next?(next.repeat==='Nunca'?'Una sola vez':next.repeat)+' · '+next.challenges.length+' retos':'Aún no has creado ninguna alarma')+'</div><div class="flex" style="margin-top:18px"><span class="chip">⚡ Despierta tu mente</span><button class="btn" data-action="newAlarm">＋ Nueva alarma</button></div></section><div class="section"><h2>Mis alarmas</h2><span class="muted">'+data.alarms.length+' alarmas</span></div>'+(data.alarms.map(alarmCard).join('')||'<div class="card empty">Todavía no tienes alarmas. Crea la primera con «Nueva alarma».</div>')+'<div class="section"><h2>Mis retos ⚡</h2><span class="muted">'+data.selected.length+' activos</span></div><div class="challenge-list">'+(defs.filter(d=>data.selected.includes(d.id)).map(challengeCard).join('')||'<div class="card empty">Todavía no has seleccionado retos.</div>')+'</div><div class="section"><h2>Accesos rápidos</h2></div><div class="grid"><button class="tile" data-action="objects"><div class="tileico">🧸</div><strong>Mis objetos</strong><small>'+data.objects.length+' objetos guardados</small></button><button class="tile" data-tab="stats"><div class="tileico">🔥</div><strong>Estadísticas</strong><small>Tu progreso</small></button></div>'}
function alarmCard(a){return '<div class="card alarmrow"><div class="alarmico">⏰</div><div class="grow"><div class="alarmtime">'+a.time+'</div><div class="meta">'+a.repeat+' · '+a.challenges.length+' retos · '+a.sound+'</div></div><button class="switch '+(a.enabled?'on':'')+'" data-toggle-alarm="'+a.id+'"></button><button class="btn ghost" data-edit="'+a.id+'">✎</button></div>'}
function alarms(){return header()+'<button class="back" data-tab="home">← Volver</button><h1>Mis alarmas ⏰</h1><p class="sub">Crea y organiza tus despertadores.</p><button class="btn full" data-action="newAlarm">＋ Nueva alarma</button><div style="margin-top:18px">'+(data.alarms.map(alarmCard).join('')||'<div class="card empty">No hay alarmas creadas todavía.</div>')+'</div><p class="hint">Importante: en iPhone, esta versión web solo puede reproducir la alarma mientras la página permanece abierta y activa. No puede garantizar que suene con Safari cerrado o el móvil bloqueado.</p>'}
function alarmForm(){let a=editing?data.alarms.find(x=>x.id===editing):null,selected=a?a.challenges:data.selected;return header()+'<button class="back" data-tab="alarms">← Volver</button><h1>'+(a?'Editar alarma':'Nueva alarma')+' ⏰</h1><p class="sub">Configura cuándo y cómo quieres despertarte.</p><div class="card"><div class="two"><div class="field"><label>Hora</label><input id="alarmTime" type="time" value="'+(a?.time||'07:30')+'"></div><div class="field"><label>Repetir</label><select id="repeat"><option '+(a?.repeat==='Nunca'?'selected':'')+'>Nunca</option><option '+(a?.repeat==='Cada día'?'selected':'')+'>Cada día</option><option '+(a?.repeat==='Días laborables'?'selected':'')+'>Días laborables</option><option '+(a?.repeat==='Fines de semana'?'selected':'')+'>Fines de semana</option></select></div></div><div class="field"><label>Retos incluidos</label><div class="chips">'+defs.map(d=>'<button class="chip '+(selected.includes(d.id)?'selected':'')+'" data-pick-challenge="'+d.id+'">'+d.ico+' '+d.name+'</button>').join('')+'</div><p class="hint">Selecciona los retos que tendrás que completar para apagar esta alarma.</p></div><div class="field"><label>Sonido de alarma</label><div class="soundrow"><select id="alarmSound">'+['Militar','Tranquila','Pajaritos','Rock','Electrónica','Clásica'].map(s=>'<option '+(((a?.sound)||data.sound)===s?'selected':'')+'>'+s+'</option>').join('')+'</select><button class="play" data-action="previewSelected">▶</button></div></div><div class="field"><label>Volumen · <span id="volLabel">'+(a?.volume??data.volume)+'%</span></label><input class="range" id="alarmVolume" type="range" min="10" max="100" value="'+(a?.volume??data.volume)+'"></div><button class="btn full" data-action="saveAlarm">Guardar alarma</button>'+(a?'<button class="btn ghost full" data-action="deleteAlarm">Eliminar alarma</button>':'')+'</div>'}
function challenges(){return header()+'<h1>Elige tus retos ⚡</h1><p class="sub">Entra en cada reto para elegir sus modalidades y su dificultad.</p><div class="challenge-list">'+defs.map(challengeCard).join('')+'</div>'}
function challengeDetail(){let d=defs.find(x=>x.id===activeChallenge),c=cfg(d.id);return header()+'<button class="back" data-tab="challenges">← Todos los retos</button><div class="flex"><div><h1>'+d.ico+' '+d.name+'</h1><p class="sub">'+d.desc+'</p></div><button class="switch '+(data.selected.includes(d.id)?'on':'')+'" data-select-challenge="'+d.id+'"></button></div><div class="card"><h2>Modalidades</h2><p class="hint">Selecciona qué tipo de prueba quieres que aparezca.</p>'+d.opts.map(o=>'<label class="option"><input type="checkbox" data-option="'+encodeURIComponent(o)+'" '+(c.options.includes(o)?'checked':'')+'><span>'+o+'</span></label>').join('')+'<div class="field"><label>Dificultad de este reto</label><div class="chips">'+d.diff.map(x=>'<button class="chip '+(c.difficulty===x?'selected':'')+'" data-difficulty="'+x+'">'+x+'</button>').join('')+'</div></div>'+(d.id==='objects'?'<button class="btn secondary full" data-action="objects">🧸 Configurar mis objetos</button>':'')+'<button class="btn full" data-action="saveChallenge">Guardar configuración</button></div>'}
function objectsPage(){return header()+'<button class="back" data-tab="challenges">← Volver a retos</button><h1>Mis objetos 🧸</h1><p class="sub">Añade cosas que tengas en casa para que WakeUp te pida encontrarlas.</p><div class="card"><div class="field"><label>Nombre del objeto</label><input id="newObject" placeholder="Ej. Mi botella azul"></div><button class="btn full" data-action="addObject">＋ Añadir objeto</button></div>'+(data.objects.map((o,i)=>'<div class="card flex"><span>'+escapeHtml(o)+'</span><button class="btn ghost" data-remove-object="'+i+'">✕</button></div>').join('')||'<div class="card empty">Todavía no has añadido objetos.</div>')+'<p class="hint">La búsqueda mediante cámara/IA no está disponible en esta versión; aquí puedes gestionar tu lista personal.</p>'}
function soundsPage(){return header()+'<h1>Sonidos 🎵</h1><p class="sub">Escucha los tonos y elige el que más te guste.</p>'+['Militar','Tranquila','Pajaritos','Rock','Electrónica','Clásica'].map(s=>'<div class="card soundrow"><button class="play" data-preview="'+s+'">▶</button><div class="grow"><strong>'+s+'</strong><div class="meta">Tono de alarma en bucle al activarse</div></div><button class="chip '+(data.sound===s?'selected':'')+'" data-choose-sound="'+s+'">'+(data.sound===s?'Seleccionado':'Elegir')+'</button></div>').join('')+'<p class="hint">Los tonos se generan en el dispositivo. Spotify no puede iniciarse automáticamente como alarma desde esta versión web de iPhone.</p>'}
function settingsPage(){return header()+'<h1>Ajustes ⚙️</h1><p class="sub">Personaliza cómo quieres usar WakeUp.</p><div class="card flex"><div><strong>Modo estricto</strong><div class="meta">Evita salir de los retos antes de completarlos mientras la app está activa.</div></div><button class="switch '+(data.strict?'on':'')+'" data-action="strict"></button></div><div class="card"><strong>Volumen predeterminado</strong><div class="field"><label><span id="defaultVolLabel">'+data.volume+'</span>%</label><input class="range" id="defaultVolume" type="range" min="10" max="100" value="'+data.volume+'"></div></div><div class="card flex"><div><strong>Mis objetos</strong><div class="meta">'+data.objects.length+' objetos guardados</div></div><button class="btn secondary" data-action="objects">Abrir</button></div><div class="card flex"><div><strong>Estadísticas</strong><div class="meta">Consulta tu progreso</div></div><button class="btn secondary" data-tab="stats">Ver</button></div><div class="card"><strong>WakeUp · WAKE UP. NO EXCUSES.</strong><p class="hint">Versión web personal. Las alarmas en segundo plano no están garantizadas por las limitaciones de iOS.</p></div>'}
function statsPage(){return header()+'<button class="back" data-tab="home">← Inicio</button><h1>Tu progreso 🔥</h1><div class="grid"><div class="card"><div class="stat">'+data.streak+'</div><div class="meta">Días de racha</div></div><div class="card"><div class="stat">'+data.alarms.length+'</div><div class="meta">Alarmas creadas</div></div><div class="card"><div class="stat">'+data.completed+'</div><div class="meta">Retos completados</div></div><div class="card"><div class="stat">'+data.objects.length+'</div><div class="meta">Objetos guardados</div></div></div>'}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===page));let app=$('#app');let views={home,alarms,alarmform:alarmForm,challenges,challengeDetail,objects:objectsPage,sounds:soundsPage,settings:settingsPage,stats:statsPage};app.innerHTML=(views[page]||home)()}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function playTone(name='Militar',vol=75){try{let AC=window.AudioContext||window.webkitAudioContext;if(!AC){toast('Este navegador no permite reproducir audio');return}ctxAudio=ctxAudio||new AC();if(ctxAudio.state==='suspended')ctxAudio.resume();let patterns={Militar:[880,880,660,880,660,523,660,880],Tranquila:[392,440,494,523,494,440,392,330],Pajaritos:[1568,1318,1760,1568,1175,1568,1976,1760],Rock:[196,196,392,294,440,392,294,196],Electrónica:[523,784,659,988,784,1175,988,784],Clásica:[523,659,784,1047,988,784,659,523]},seq=patterns[name]||patterns.Militar,start=ctxAudio.currentTime;seq.forEach((f,i)=>{let osc=ctxAudio.createOscillator(),gain=ctxAudio.createGain(),t=start+i*.48;osc.type=name==='Rock'?'sawtooth':name==='Pajaritos'?'sine':'triangle';osc.frequency.setValueAtTime(f,t);gain.gain.setValueAtTime(.0001,t);gain.gain.linearRampToValueAtTime((vol/100)*.30,t+.035);gain.gain.setTargetAtTime(.0001,t+.31,.055);osc.connect(gain);gain.connect(ctxAudio.destination);osc.start(t);osc.stop(t+.46)})}catch(e){toast('No se ha podido reproducir el tono')}}
function stopRinging(){if(ringInterval)clearInterval(ringInterval);ringInterval=null;ringAlarm=null;let ov=$('#ringOverlay');if(ov)ov.remove()}
function startRinging(a){stopRinging();ringAlarm=a;if(ctxAudio&&ctxAudio.state==='suspended')ctxAudio.resume();gameQueue=a.challenges.map(id=>defs.find(d=>d.id===id)).filter(Boolean);gameIndex=0;document.body.insertAdjacentHTML('beforeend','<div id="ringOverlay" style="position:fixed;inset:0;z-index:20;background:linear-gradient(160deg,#06172a,#123e61);overflow:auto;padding:calc(24px + env(safe-area-inset-top)) 18px calc(30px + env(safe-area-inset-bottom))"><div id="ringContent"></div></div>');playTone(a.sound,a.volume||data.volume);ringInterval=setInterval(()=>playTone(a.sound,a.volume||data.volume),2200);showNextGame()}
function showNextGame(){let host=$('#ringContent');if(gameIndex>=gameQueue.length){host.innerHTML='<div style="text-align:center;padding-top:12vh"><div class="big-emoji">🌅</div><h1>¡Lo has conseguido!</h1><p class="sub">Has completado todos los retos. Ya puedes empezar el día.</p><button class="btn full" id="finishAlarm">Apagar alarma</button></div>';$('#finishAlarm').onclick=()=>{stopRinging();data.completed+=gameQueue.length;data.streak++;save();toast('¡Buen trabajo! Día completado');render()};return}let d=gameQueue[gameIndex];gameCurrent=makeGame(d);let pct=Math.round(gameIndex/Math.max(1,gameQueue.length)*100);host.innerHTML='<div class="flex"><span class="eyebrow">WAKE UP · NO EXCUSES</span><span class="chip">'+(gameIndex+1)+' / '+gameQueue.length+'</span></div><div class="game-progress"><span style="width:'+pct+'%"></span></div><h1>'+d.ico+' '+d.name+'</h1><p class="sub">Completa esta prueba para continuar.</p><div class="card" id="gameCard">'+gameCurrent.html+'</div><div id="gameFeedback" class="hint" aria-live="polite"></div>';wireGame(d)}
function makeGame(d){let diff=cfg(d.id).difficulty,opts=cfg(d.id).options,level=diff==='Difícil'||diff==='Intenso'?3:diff==='Medio'?2:1;
if(d.id==='math'||d.id==='speed'){let a=rand(3,level===3?30:12),b=rand(2,level===3?15:9),op=(opts[0]||'Sumas');if(op==='Restas')return answerGame('¿Cuánto es '+(a+b)+' − '+b+'?',String(a),true);if(op==='Multiplicaciones')return answerGame('¿Cuánto es '+a+' × '+b+'?',String(a*b),true);if(op==='Divisiones')return answerGame('¿Cuánto es '+(a*b)+' ÷ '+b+'?',String(a),true);return answerGame('¿Cuánto es '+a+' + '+b+'?',String(a+b),true)}
if(d.id==='quiz'||d.id==='logic'||d.id==='observe'){let bank=[['¿Cuál es el planeta más cercano al Sol?',['Venus','Mercurio','Marte'],'Mercurio'],['¿Cuántos lados tiene un hexágono?',['5','6','8'],'6'],['¿Qué gas respiramos principalmente para vivir?',['Oxígeno','Helio','Hidrógeno'],'Oxígeno'],['¿En qué continente está Japón?',['Europa','Asia','África'],'Asia'],['¿Cuánto es 5 × 6?',['25','30','35'],'30'],['¿Qué animal es un mamífero?',['Tiburón','Delfín','Trucha'],'Delfín']];let q=bank[rand(0,bank.length-1)];return choiceGame(q[0],q[1],q[2])}
if(d.id==='memory'){let seq=Array.from({length:level+2},()=>['🔵','🟢','🟡','🔴'][rand(0,3)]);return memoryGame(seq)}
if(d.id==='objects'){let obj=data.objects.length?data.objects[rand(0,data.objects.length-1)]:'un objeto que uses cada día';return choiceGame('Busca físicamente '+obj+' y, cuando lo tengas, elige «Ya lo encontré».',['Ya lo encontré','Necesito otro objeto'],'Ya lo encontré')}
if(d.id==='exercise'){let ex=opts[0]||'Sentadillas',n=level===3?15:level===2?10:5;return choiceGame('Haz '+n+' '+ex.toLowerCase()+' y pulsa cuando termines.',['He terminado','Necesito descansar'],'He terminado')}
if(d.id==='draw')return {type:'draw',html:'<h2>Dibuja '+['un corazón','una casa','un gato','un árbol'][rand(0,3)]+' en esta pizarra:</h2><div class="draw-tools"><label class="hint">Color <input id="drawColor" type="color" value="#102b47"></label><label class="hint">Grosor <input id="drawSize" type="range" min="2" max="16" value="5"></label><button id="drawErase">Borrar</button></div><canvas id="drawCanvas" class="draw-board" width="700" height="480"></canvas><button class="btn full" id="drawDone">He terminado</button>'};
if(d.id==='sounds')return choiceGame('Imita el sonido de un '+['perro','gato','tren','teléfono'][rand(0,3)]+' y después confirma.',['He reconocido el sonido','Repetir'],'He reconocido el sonido');
return choiceGame('Mira esta secuencia y selecciona el elemento que falta: 🔺 🔵 🔺 🔵 ?', ['🔺','🔵','🟢'],'🔺')}
function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min}
function answerGame(q,correct,numeric){return {type:'input',correct,html:'<h2>'+q+'</h2><input class="game-input" id="gameAnswer" inputmode="numeric" placeholder="Tu respuesta"><button class="btn full" id="checkGame">Comprobar</button>'}}
function choiceGame(q,choices,correct){return {type:'choice',correct,html:'<h2>'+q+'</h2>'+choices.map(c=>'<button class="game-choice" data-game-choice="'+encodeURIComponent(c)+'">'+c+'</button>').join('')}}
function memoryGame(seq){let names=seq.map(x=>({'🔵':'azul','🟢':'verde','🟡':'amarillo','🔴':'rojo'}[x]));return {type:'memory',seq:names,html:'<h2>Memoriza esta secuencia de colores:</h2><div class="big-emoji" id="sequence">'+seq.join('　')+'</div><p class="hint">Después escribe los colores en orden, separados por comas o espacios. Ejemplo: rojo, verde, rojo.</p><button class="btn full" id="remember">Ya la recuerdo</button><div id="memoryChoices"></div>'}}
function wireGame(d){let g=gameCurrent;if(g.type==='draw'){let c=$('#drawCanvas'),cx=c.getContext('2d'),drawing=false;cx.lineCap='round';cx.lineJoin='round';function pos(e){let r=c.getBoundingClientRect();return {x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}c.addEventListener('pointerdown',e=>{drawing=true;c.setPointerCapture(e.pointerId);let p=pos(e);cx.beginPath();cx.moveTo(p.x,p.y)});c.addEventListener('pointermove',e=>{if(!drawing)return;let p=pos(e);cx.strokeStyle=$('#drawColor').value;cx.lineWidth=Number($('#drawSize').value);cx.lineTo(p.x,p.y);cx.stroke()});['pointerup','pointercancel'].forEach(ev=>c.addEventListener(ev,()=>drawing=false));$('#drawErase').onclick=()=>cx.clearRect(0,0,c.width,c.height);$('#drawDone').onclick=()=>{if(!c.toDataURL().includes('data:image/png;base64,')){return}gameIndex++;showNextGame()};return}if(g.type==='input')$('#checkGame').onclick=()=>checkGame($('#gameAnswer').value.trim(),g.correct);if(g.type==='choice')document.querySelectorAll('[data-game-choice]').forEach(b=>b.onclick=()=>checkGame(decodeURIComponent(b.dataset.gameChoice),g.correct));if(g.type==='memory')$('#remember').onclick=()=>{let box=$('#memoryChoices');$('#sequence').textContent='¿Cuál era la secuencia?';box.innerHTML='<input class="game-input" id="memoryAnswer" placeholder="rojo, verde, rojo..."><button class="btn full" id="checkMemory">Comprobar</button>';$('#checkMemory').onclick=()=>{let answer=$('#memoryAnswer').value.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').split(/[ ,;]+/).filter(Boolean).join('|');let expected=g.seq.map(x=>x.normalize('NFD').replace(/[\\u0300-\\u036f]/g,'')).join('|');checkGame(answer,expected)}}}
function checkGame(value,correct){let ok=String(value).trim().toLowerCase()===String(correct).trim().toLowerCase();if(ok){gameIndex++;showNextGame()}else{$('#gameFeedback').textContent='No es correcto. ¡Inténtalo otra vez!';$('#gameFeedback').style.color='#ffb3a7'}}
function checkAlarms(){let now=new Date(),hh=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'),stamp=now.toDateString()+' '+hh;data.alarms.forEach(a=>{if(a.enabled&&a.time===hh&&a.lastFired!==stamp){a.lastFired=stamp;save();startRinging(a)}})}
setInterval(checkAlarms,10000);
function openChallenge(id){activeChallenge=id;go('challengeDetail')}
function saveAlarm(){let time=$('#alarmTime').value,repeat=$('#repeat').value,sound=$('#alarmSound').value,volume=Number($('#alarmVolume').value);if(!time){toast('Selecciona una hora');return}let chosen=[...document.querySelectorAll('[data-pick-challenge].selected')].map(x=>x.dataset.pickChallenge);if(!chosen.length){toast('Selecciona al menos un reto');return}let alarm={id:editing||String(Date.now()),time,repeat,challenges:chosen,sound,volume,enabled:true};if(editing){let i=data.alarms.findIndex(x=>x.id===editing);data.alarms[i]=alarm}else data.alarms.push(alarm);data.sound=sound;data.volume=volume;data.selected=[...new Set([...data.selected,...chosen])];save();editing=null;toast('Alarma guardada');go('alarms')}
document.addEventListener('click',e=>{let t=e.target.closest('button,[data-open-challenge]');if(!t)return;if(t.dataset.tab){go(t.dataset.tab);return}if(t.dataset.openChallenge){openChallenge(t.dataset.openChallenge);return}if(t.dataset.challenge){openChallenge(t.dataset.challenge);return}if(t.dataset.pickChallenge){t.classList.toggle('selected');return}if(t.dataset.difficulty){cfg(activeChallenge).difficulty=t.dataset.difficulty;save();render();return}if(t.dataset.action){let a=t.dataset.action;if(a==='newAlarm'){editing=null;go('alarmform')}else if(a==='saveAlarm')saveAlarm();else if(a==='previewSelected')playTone($('#alarmSound').value,Number($('#alarmVolume').value));else if(a==='objects')go('objects');else if(a==='addObject'){let v=$('#newObject').value.trim();if(v){data.objects.push(v);save();render();toast('Objeto añadido')}}else if(a==='strict'){data.strict=!data.strict;save();render()}else if(a==='saveChallenge'){if(!cfg(activeChallenge).options.length){toast('Selecciona al menos una modalidad');return}save();toast('Reto actualizado');go('challenges')}else if(a==='deleteAlarm'){data.alarms=data.alarms.filter(x=>x.id!==editing);save();editing=null;go('alarms')}else if(a==='welcome')toast('¡Que tengas un buen día!');return}if(t.dataset.selectChallenge){let id=t.dataset.selectChallenge;data.selected=data.selected.includes(id)?data.selected.filter(x=>x!==id):[...data.selected,id];save();render();return}if(t.dataset.toggleAlarm){let a=data.alarms.find(x=>x.id===t.dataset.toggleAlarm);a.enabled=!a.enabled;save();render();return}if(t.dataset.edit){editing=t.dataset.edit;go('alarmform');return}if(t.dataset.preview){playTone(t.dataset.preview,data.volume);return}if(t.dataset.chooseSound){data.sound=t.dataset.chooseSound;save();render();toast('Sonido seleccionado');return}if(t.dataset.removeObject!==undefined){data.objects.splice(Number(t.dataset.removeObject),1);save();render();return}});
document.addEventListener('change',e=>{if(e.target.dataset.option){let value=decodeURIComponent(e.target.dataset.option),c=cfg(activeChallenge);c.options=e.target.checked?[...new Set([...c.options,value])]:c.options.filter(x=>x!==value);save()}if(e.target.id==='alarmVolume')$('#volLabel').textContent=e.target.value+'%';if(e.target.id==='defaultVolume'){data.volume=Number(e.target.value);$('#defaultVolLabel').textContent=e.target.value;save()}});
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();
</script></body></html>
